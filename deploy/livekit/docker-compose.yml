# LiveKit only — the droplet's existing nginx handles HTTPS for
# calls.kashiguard.com (see README.md, step 4).
#   docker compose up -d
services:
  livekit:
    image: livekit/livekit-server:v1.8
    container_name: livekit
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    network_mode: host        # WebRTC needs the UDP ranges on the host
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro   # certificate for TURN/TLS
