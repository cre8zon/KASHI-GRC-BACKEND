# LiveKit server for KashiGRC in-app calls.
# Replace the key/secret (generate: openssl rand -hex 32) and keep the SAME
# pair in the backend's LIVEKIT_API_KEY / LIVEKIT_API_SECRET.
port: 7880                 # signalling (behind Caddy on 443)
rtc:
  tcp_port: 7881           # media over TCP when UDP is blocked
  port_range_start: 50000  # media over UDP
  port_range_end: 60000
  use_external_ip: true    # advertise the server's public IP
turn:
  enabled: true            # relay for networks that block direct media (relay ports UDP 30000-40000)
  domain: turn.calls.example.com
  tls_port: 5349
  udp_port: 3478
  external_tls: true       # Caddy terminates TLS for the TURN domain
keys:
  REPLACE_WITH_API_KEY: REPLACE_WITH_A_SECRET_OF_AT_LEAST_32_CHARACTERS
room:
  empty_timeout: 300       # close a room 5 min after the last person leaves
  max_participants: 50
logging:
  level: info
# Deliberately NOT configured: egress (recording) and ingress. Calls are not
# recorded anywhere.
